plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

// Live tests (see src/devtest): only on the dev run's classpath, never in the jar.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        rtsclient {
            sourceSet sourceSets.main
            sourceSet sourceSets.devtest
        }
    }
    runs {
        client {
            source sourceSets.devtest
            // ./gradlew runClient -Pautotest=dome6,sphere5 (or all) [-Pautoquit]
            if (project.hasProperty('autotest')) {
                property 'rtsclient.autotest', project.property('autotest').toString()
                property 'rtsclient.autotest.quit', project.hasProperty('autoquit').toString()
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Baritone is a runtime dependency supplied by the player; we only compile against its API.
    // Drop baritone-api-fabric-<version>.jar into libs/ (CI downloads it automatically).
    def baritoneJars = fileTree(dir: 'libs', include: 'baritone-api-fabric-*.jar')
    modCompileOnly baritoneJars
    modLocalRuntime baritoneJars
    // Baritone bundles its pathfinding library (nether-pathfinder) inside its jar, which the dev client
    // doesn't unpack: extract it next to the Baritone jar in libs/ (CI only compiles, so it doesn't need it).
    localRuntime fileTree(dir: 'libs', include: 'nether-pathfinder-*.jar')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
